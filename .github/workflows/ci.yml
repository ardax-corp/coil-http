name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: coil-http

      - uses: actions/checkout@v4
        with:
          repository: ardax-corp/coil-lang
          path: coil-lang

      - uses: actions/checkout@v4
        with:
          repository: ardax-corp/coil-stdlib
          path: coil-stdlib

      - uses: actions/checkout@v4
        with:
          repository: ardax-corp/coil-tls
          path: coil-tls

      - name: Install system deps
        run: sudo apt-get update && sudo apt-get install -y libffi-dev build-essential

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Build coil
        working-directory: coil-lang
        run: cargo build

      - name: Build coil-tls native
        working-directory: coil-tls/native
        run: |
          set -euo pipefail
          make artifact
          if [ ! -f libtls.so ] && [ ! -f libtls.dylib ] && [ ! -f tls.dll ]; then
            echo "libtls not on [ffi] search_paths (coil-tls/native)" >&2
            ls -la
            exit 1
          fi

      # Spawned workers skip ffi_init; coil-tls falls back to ./native/libtls.so.
      - name: Stage libtls for worker dload
        run: |
          set -euo pipefail
          mkdir -p coil-http/native
          if [ -f coil-tls/native/libtls.so ]; then
            cp coil-tls/native/libtls.so coil-http/native/
          elif [ -f coil-tls/native/libtls.dylib ]; then
            cp coil-tls/native/libtls.dylib coil-http/native/
          else
            cp coil-tls/native/tls.dll coil-http/native/
          fi

      - name: Forbid leftover io::__tls import
        working-directory: coil-http
        run: |
          if grep -R --include='*.hy' -E 'use io::__tls' src tests examples; then
            echo "use io::__tls is forbidden in this package" >&2
            exit 1
          fi

      - name: Run coil-http tests
        working-directory: coil-http
        run: ../coil-lang/target/debug/coil test

      - name: Loopback integration (threads; not available in test harness)
        working-directory: coil-http
        run: ../coil-lang/target/debug/coil examples/loopback.hy | grep -q ok

      - name: Keep-alive loopback (two GETs on one connection)
        working-directory: coil-http
        run: ../coil-lang/target/debug/coil examples/keepalive.hy | grep -q ok

      - name: HTTP/2 prior-knowledge loopback
        working-directory: coil-http
        run: ../coil-lang/target/debug/coil examples/h2_loopback.hy | grep -q ok

      - name: HTTP/2 multi-stream loopback
        working-directory: coil-http
        run: ../coil-lang/target/debug/coil examples/h2_mux_loopback.hy | grep -q ok

      - name: HTTP/2 TLS ALPN loopback
        working-directory: coil-http
        run: ../coil-lang/target/debug/coil examples/h2_tls_loopback.hy | grep -q ok
