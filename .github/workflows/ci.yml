name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: coil-http

      - uses: actions/checkout@v4
        with:
          repository: ardax-corp/coil-lang
          path: coil-lang
          # coil-lang #457: park/resume Result<(), IoError> matches Ok (COI-408).
          ref: 9819a3d2a25d4fb9ae70b41cb85d325507cdee46

      - uses: actions/checkout@v4
        with:
          repository: ardax-corp/coil-stdlib
          path: coil-stdlib

      - name: Install system deps
        run: sudo apt-get update && sudo apt-get install -y libffi-dev build-essential

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Build coil
        working-directory: coil-lang
        run: cargo build

      - name: Install tls from coil.lock
        working-directory: coil-http
        run: |
          set -euo pipefail
          chmod +x scripts/spool_install.sh
          ./scripts/spool_install.sh
          test -d .spool/deps/tls/src
          test -d .spool/deps/tls/native

      - name: Build coil-tls native
        working-directory: coil-http/.spool/deps/tls/native
        run: |
          set -euo pipefail
          make artifact
          if [ ! -f libtls.so ] && [ ! -f libtls.dylib ] && [ ! -f tls.dll ]; then
            echo "libtls not on [ffi] search_paths (.spool/deps/tls/native)" >&2
            ls -la
            exit 1
          fi

      # Spawned workers skip ffi_init; coil-tls falls back to ./native/libtls.so.
      - name: Stage libtls for worker dload
        run: |
          set -euo pipefail
          mkdir -p coil-http/native
          if [ -f coil-http/.spool/deps/tls/native/libtls.so ]; then
            cp coil-http/.spool/deps/tls/native/libtls.so coil-http/native/
          elif [ -f coil-http/.spool/deps/tls/native/libtls.dylib ]; then
            cp coil-http/.spool/deps/tls/native/libtls.dylib coil-http/native/
          else
            cp coil-http/.spool/deps/tls/native/tls.dll coil-http/native/
          fi

      - name: Forbid leftover io::__tls import
        working-directory: coil-http
        run: |
          if grep -R --include='*.hy' -E 'use io::__tls' src tests examples; then
            echo "use io::__tls is forbidden in this package" >&2
            exit 1
          fi

      - name: Run coil-http tests
        working-directory: coil-http
        run: ../coil-lang/target/debug/coil test

      - name: Loopback integration (threads; not available in test harness)
        working-directory: coil-http
        run: ../coil-lang/target/debug/coil examples/loopback.hy | grep -q ok

      - name: Keep-alive loopback (two GETs on one connection)
        working-directory: coil-http
        run: ../coil-lang/target/debug/coil examples/keepalive.hy | grep -q ok

      - name: HTTP/2 prior-knowledge loopback
        working-directory: coil-http
        run: ../coil-lang/target/debug/coil examples/h2_loopback.hy | grep -q ok

      - name: HTTP/2 multi-stream loopback
        working-directory: coil-http
        run: ../coil-lang/target/debug/coil examples/h2_mux_loopback.hy | grep -q ok

      - name: HTTP/2 TLS ALPN loopback
        working-directory: coil-http
        run: ../coil-lang/target/debug/coil examples/h2_tls_loopback.hy | grep -q ok

      - name: WebSocket echo loopback
        working-directory: coil-http
        run: ../coil-lang/target/debug/coil examples/ws_loopback.hy | grep -q ok

      - name: Cross-process EAGAIN HTTP/1 GET
        working-directory: coil-http
        run: |
          set -euo pipefail
          python3 scripts/delay_http_server.py h1 18765 &
          spid=$!
          trap 'kill $spid 2>/dev/null || true' EXIT
          sleep 0.2
          ../coil-lang/target/debug/coil examples/eagain_h1.hy | grep -q ok

      - name: Cross-process EAGAIN HTTP/2 GET
        working-directory: coil-http
        run: |
          set -euo pipefail
          python3 scripts/delay_http_server.py h2 18766 &
          spid=$!
          trap 'kill $spid 2>/dev/null || true' EXIT
          sleep 0.2
          ../coil-lang/target/debug/coil examples/eagain_h2.hy | grep -q ok
